<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">KirDev Studio animated monochrome banner</title>
<desc id="desc">KIRDEV wordmark with softly moving orbit lines, drifting particles, scanning light and KiroX Fusion-inspired monochrome design.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070707"/><stop offset=".5" stop-color="#151515"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="text" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9e9e9e"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
 <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<style>
 .orbit{transform-origin:600px 160px;animation:orbit 26s linear infinite}
 .orbit2{transform-origin:600px 160px;animation:orbit 38s linear infinite reverse}
 .beam{animation:slide 9s ease-in-out infinite}
 .dot{animation:blink 3.5s ease-in-out infinite}
 .word{font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:93px;letter-spacing:17px;fill:url(#text)}
 .subtitle{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:17px;letter-spacing:6px;fill:#c5c5c5}
 .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:3px;fill:#8c8c8c}
 .line{animation:breath 4s ease-in-out infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes slide{0%,100%{transform:translateX(-530px);opacity:0}30%,70%{opacity:1}50%{transform:translateX(530px)}}
 @keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
 @keyframes breath{0%,100%{opacity:.28}50%{opacity:.75}}
 @media (prefers-reduced-motion:reduce){.orbit,.orbit2,.beam,.dot,.line{animation:none}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#grid)"/>
<g fill="none" stroke="#fff" stroke-opacity=".12">
 <ellipse class="orbit" cx="600" cy="160" rx="510" ry="115" transform="rotate(-16 600 160)"/>
 <ellipse class="orbit2" cx="600" cy="160" rx="485" ry="132" transform="rotate(18 600 160)"/>
 <circle cx="600" cy="160" r="236" stroke-opacity=".07"/>
</g>
<g fill="#fff"><circle class="dot" cx="110" cy="65" r="2.4"/><circle class="dot" cx="1052" cy="238" r="2.7" style="animation-delay:1.1s"/><circle class="dot" cx="990" cy="64" r="1.8" style="animation-delay:2.2s"/><circle class="dot" cx="225" cy="249" r="2" style="animation-delay:.8s"/></g>
<rect class="beam" x="480" y="0" width="240" height="320" fill="url(#beam)"/>
<path d="M46 47h56M46 47v28M1154 47h-56M1154 47v28M46 273h56M46 273v-28M1154 273h-56M1154 273v-28" fill="none" stroke="#eee" stroke-opacity=".34" stroke-width="1.5"/>
<text x="600" y="152" text-anchor="middle" class="word">KIRDEV</text>
<path class="line" d="M410 177H790" stroke="#fff" stroke-width="1.5"/>
<text x="600" y="212" text-anchor="middle" class="subtitle">STUDIO / FUSION</text>
<text x="600" y="246" text-anchor="middle" class="small">ANDROID  ·  TELEGRAM  ·  WINDOWS  ·  WEB</text>
<text x="68" y="289" class="small" font-size="10">EST. 2020</text>
<text x="1130" y="289" text-anchor="end" class="small" font-size="10">CREATE / CUSTOMIZE / RELEASE</text>
</g>
</svg>